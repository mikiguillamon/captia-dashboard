name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    # Nota README: se activa al publicar el repo en un remoto (hoy solo git local).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: captia_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: captia_app
      PGPASSWORD: captia
      RAILS_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # Mismo principio que db/init/01-roles.sql: Rails nunca conecta como
      # superusuario (RLS debe aplicarle también al owner con FORCE).
      - name: Crear rol no-superusuario captia_app
        env:
          PGPASSWORD: postgres
        run: |
          pg_isready -h 127.0.0.1 -U postgres
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE captia_app LOGIN PASSWORD 'captia' NOSUPERUSER CREATEDB NOBYPASSRLS;
          ALTER DATABASE captia_test OWNER TO captia_app;
          \connect captia_test
          ALTER SCHEMA public OWNER TO captia_app;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          GRANT USAGE, CREATE ON SCHEMA public TO captia_app;
          SQL

      - name: Preparar base de datos de test
        run: bin/rails db:test:prepare

      - name: Gates de calidad (test + rubocop + brakeman)
        run: bin/rake ci
